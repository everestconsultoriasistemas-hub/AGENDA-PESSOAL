<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#e4e2da;--task:#d98b00;--meet:#2563eb;--bad:#d1342f;--ok:#2e8b57;--ac:#1d1d1b;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#201f1d;--tx:#f2f0ea;--mut:#a09e97;--bd:#33312d;--task:#f0a62a;--meet:#6b97ff;--bad:#ff6b63;--ok:#5cc58b;--ac:#f2f0ea;--acx:#141413;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#201f1d;--tx:#f2f0ea;--mut:#a09e97;--bd:#33312d;--task:#f0a62a;--meet:#6b97ff;--bad:#ff6b63;--ok:#5cc58b;--ac:#f2f0ea;--acx:#141413;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sub{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat.bad b{color:var(--bad)}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--mut)}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 8px}
h2.bad{color:var(--bad)}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--task);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it.meeting{border-left-color:var(--meet)}
.it.done{opacity:.5}.it.done .t{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:transparent;color:var(--ok);flex:none;font-size:16px;line-height:1}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--mut)}
.meeting .tag b{color:var(--meet)}.task .tag b{color:var(--task)}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.empty{color:var(--mut);text-align:center;padding:20px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:center}
.mic{flex:1;max-width:420px;padding:16px;border-radius:14px;border:0;background:var(--ac);color:var(--acx);font-size:18px;font-weight:600}
.mic.rec{background:var(--bad);color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.7}}
.add{width:60px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:26px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.box{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.box label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.box input[type=text],.box input[type=date],.box input[type=time]{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--tx)}
.seg button.on[data-k=task]{border-color:var(--task)}.seg button.on[data-k=meeting]{border-color:var(--meet)}
.alert{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--bad);color:#fff;border-radius:14px;padding:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.alert.on{display:block}
.alert b{font-size:18px;display:block;margin-bottom:8px}
.alert button{background:#fff;color:#000;border:0;border-radius:8px;padding:8px 12px;margin-right:6px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.tab{font-size:13px;padding:9px 2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:12px;color:var(--mut)}
.cd{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cd.today{border-color:var(--tx);font-weight:700}
.cd.sel{background:var(--ac);color:var(--acx)}
.cd.off{visibility:hidden}
.cd i{display:flex;gap:3px;height:6px}
.cd u{width:6px;height:6px;border-radius:50%;display:block}
:root{--bg:#f2f3f8;--card:#fff;--bd:#e6e8f0;--mut:#6b7280;--task:#f59e0b;--meet:#3b6cf6;--ac:#4f46e5;--acx:#fff;--sh:0 4px 18px rgba(30,30,80,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--card:#181b25;--bd:#272b38;--mut:#9aa1b2;--task:#fbbf24;--meet:#7da2ff;--ac:#7c75ff;--acx:#0e1016;--sh:0 4px 18px rgba(0,0,0,.4)}}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(79,70,229,.35)}
.hero .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero .sub{color:rgba(255,255,255,.8);text-transform:capitalize}

#pgB{height:100%;width:0;background:#fff;border-radius:99px;transition:width .4s}
.pgt{font-size:13px;margin-top:6px;color:rgba(255,255,255,.9)}
.stats{gap:10px}
.stat{border:0;border-radius:16px;box-shadow:var(--sh);padding:12px 6px}
.stat em{font-style:normal;display:block;font-size:18px;margin-bottom:2px}
.stat b{font-size:28px;line-height:1.1}
.stat.late{border-top:3px solid var(--bad)}.stat.late b{color:var(--bad)}
.stat.meet{border-top:3px solid var(--meet)}.stat.meet b{color:var(--meet)}
.stat.task{border-top:3px solid var(--task)}.stat.task b{color:var(--task)}
.tabs{background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--sh);gap:2px}
.tab{border:0;border-radius:10px;background:transparent}
.tab.on{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.it{border:0;border-left:6px solid var(--task);border-radius:16px;box-shadow:var(--sh);padding:13px 14px}
.it.meeting{border-left-color:var(--meet)}
.it .t{font-weight:600}
.it .tag{font-weight:400;margin-top:2px}
.chk{border-color:var(--task);width:30px;height:30px}.meeting .chk{border-color:var(--meet)}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
h2{margin:22px 4px 10px}
.bar{background:linear-gradient(transparent,var(--bg) 45%);border:0;padding-top:26px;pointer-events:none}
.bar>*{pointer-events:auto}
.mic{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:999px;box-shadow:0 8px 24px rgba(79,70,229,.45)}
.mic.rec{background:var(--bad)}
.add{border-radius:50%;width:60px;height:60px;background:var(--card);box-shadow:var(--sh);border:0;color:var(--ac)}
.box{border-radius:24px 24px 0 0}

.cd.sel{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.empty{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:28px 16px}
:root[data-theme="dark"]{--bg:#0b0d12;--card:#14171f;--bd:#242936;--tx:#e8e6e1;--mut:#8b93a5;--task:#c9a24b;--meet:#5b8def;--bad:#e5534b;--ok:#3fae7a;--ac:#c9a24b;--acx:#0b0d12;--sh:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}
body{letter-spacing:.005em}

.pgw{height:4px;background:#262c3a}
#pgB{background:var(--task)}
.pgt{color:var(--mut);font-size:12px;letter-spacing:.04em}
.stat{border:1px solid var(--bd);border-radius:8px;box-shadow:none}
.stat em{display:none}
.stat b{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .sub{text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.tabs{border:1px solid var(--bd);border-radius:8px;box-shadow:none}
.tab{border-radius:6px;font-weight:500;letter-spacing:.03em}
.tab.on{background:var(--task);color:#0b0d12;font-weight:700}

.it.meeting{border-left-color:var(--meet)}
.it .t{font-weight:500}
.chk{border-radius:6px;border-width:1.5px}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#0b0d12}
h2{color:var(--mut);letter-spacing:.14em;font-size:11px;border-bottom:1px solid var(--bd);padding-bottom:6px}
h2.bad{color:var(--bad)}
.mic{background:var(--task);color:#0b0d12;border-radius:8px;box-shadow:none;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:15px}
.mic.rec{background:var(--bad);color:#fff}
.add{border-radius:8px;border:1px solid var(--bd);box-shadow:none;color:var(--task)}
.cd{border:1px solid var(--bd);border-radius:6px;box-shadow:none}
.cd.today{box-shadow:inset 0 0 0 1px var(--task);color:var(--task)}
.cd.sel{background:var(--task);color:#0b0d12}
.box{border-radius:14px 14px 0 0;border-top:2px solid var(--task)}
.box input[type=text],.box input[type=date],.box input[type=time]{border-radius:6px}
.seg button{border-radius:6px}
.btn{border-radius:6px}
.empty{border:1px solid var(--bd);border-radius:8px;box-shadow:none}
:root[data-theme="light"]{--bg:#f3f4f7;--card:#fff;--bd:#dde1e8;--tx:#0f1b2d;--mut:#64708a;--task:#a8801f;--meet:#1f4fd8;--bad:#c0392b;--ok:#1e8e5a;--ac:#0f1b2d;--acx:#fff;--sh:0 1px 3px rgba(15,27,45,.07);color-scheme:light}
.hero{background:linear-gradient(135deg,#0f1b2d,#17294a);color:#eef0f4;border:0;border-top:2px solid #d6b25e}
.hero h1{color:#fff}.hero .sub,.pgt{color:#9fb0cc}
.hero .btn{color:#d6b25e;border-color:#3a4c70}
.pgw{background:#2a3a57}#pgB{background:#d6b25e}
.hb{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.foot{display:flex;gap:8px;margin-top:14px}.foot .btn{flex:1;font-size:13px;color:var(--mut)}
:root[data-theme="light"] .tab.on,:root[data-theme="light"] .cd.sel,:root[data-theme="light"] .mic{background:#0f1b2d;color:#fff}
:root[data-theme="light"] .mic.rec{background:var(--bad)}
:root[data-theme="light"] .it.done .chk{color:#fff}
:root[data-theme="light"] .add{color:#0f1b2d}
:root[data-theme="light"] .stat,:root[data-theme="light"] .it,:root[data-theme="light"] .tabs,:root[data-theme="light"] .cd,:root[data-theme="light"] .empty{box-shadow:var(--sh)}

/* ===== layout responsivo (celular + notebook) ===== */

button{touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;padding-bottom:130px}

.hero .row1{flex-direction:column;align-items:stretch;gap:12px}

@media (max-width:380px){.hero h1{font-size:22px}.stat b{font-size:24px}.tab{font-size:12px}}

.it.virt{opacity:.72}
</style>

<body>
<div class="alert" id="alert"><b id="aT"></b><span id="aS"></span><div style="margin-top:10px"><button id="aOk">Ok, vi</button><button id="aSn">Adiar 10 min</button></div></div>
<main>
  <aside class="side"><div class="hero"><div class="row1"><div><h1 id="greet">Minha Agenda</h1><div class="sub" id="today"></div></div><div class="hb"><button class="btn" id="bell">Ativar alertas</button><button class="btn" id="syn">Sincronizar</button><button class="btn" id="thm">Tema</button></div></div><div class="pgw"><div id="pgB"></div></div><div class="pgt" id="pgT"></div></div>
  <div class="stats">
    <div class="stat late"><em>⚠️</em><b id="nLate">0</b><span class="sub">Atrasadas</span></div>
    <div class="stat meet"><em>👥</em><b id="nMeet">0</b><span class="sub">Reuniões hoje</span></div>
    <div class="stat task"><em>📝</em><b id="nTask">0</b><span class="sub">Tarefas hoje</span></div>
  </div></aside>
  <section class="content"><div class="tabs"><button class="tab on" data-v="hoje">Hoje</button><button class="tab" data-v="prox">Próximos</button><button class="tab" data-v="cal">Calendário</button><button class="tab" data-v="feito">Feitas</button></div>
  <div id="list"></div></section>

</main>
<div class="bar"><button class="mic" id="mic">Ditar atividade</button><button class="add" id="add" aria-label="Adicionar">+</button></div>

</div></div>
<script>
(function(){
var K='agenda_v1',calOff=0,calSel=null,items=[],view='hoje',kind='task',editId=null;
function load(){try{items=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){items=[]}try{tomb=JSON.parse(localStorage.getItem(TB)||'[]')}catch(e){tomb=[]}snap={};items.forEach(function(i){snap[String(i.id)]=ky(i)})}
function save(){stamp();try{localStorage.setItem(K,JSON.stringify(items));localStorage.setItem(TB,JSON.stringify(tomb))}catch(e){}push()}
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d}
function at(it){return new Date(it.date+'T'+(it.time||'23:59')+':00')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---- interpretação da fala ---- */
function parse(raw){
  var s=' '+raw.toLowerCase()+' ',cut=[],type='task',date=ds(new Date()),time='',m;
  if(/reuni[aã]o|videochamada|\bcall\b|consulta|encontro|compromisso|entrevista/.test(s))type='meeting';
  function rm(re){var r=s.match(re);if(r){cut.push(r[0]);}return r}
  var rec='',wd=null,WN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'],q;

    stat('Sync ✓')
  }catch(e){stat('Sync ✗')}
  busy=false;if(again){again=false;sync()}
}
function push(){if(!cfgOk||!code)return;clearTimeout(pt);pt=setTimeout(sync,1500)}
$('syn').onclick=function(){
  if(!cfgOk){alert('A sincronização ainda não foi configurada. Preencha o arquivo config.js (veja as instruções).');return}
  var c=prompt('Código de sincronização.\nUse o MESMO código nos dois aparelhos.\nDeixe vazio para gerar um novo:',code);
  if(c===null)return;c=c.trim().toLowerCase();
  if(!c){var a=new Uint8Array(8);crypto.getRandomValues(a);c=Array.prototype.map.call(a,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
  if(!/^[a-z0-9-]{12,}$/.test(c)){alert('Use no mínimo 12 letras ou números, sem espaços.');return}
  code=c;try{localStorage.setItem(SC,c)}catch(e){}
  prompt('Seu código (anote e digite igual no outro aparelho):',c);sync();setTimeout(pushSub,3000)};
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',sync);
setInterval(sync,30000);
stat(cfgOk&&code?'Sync…':'Sincronizar');

load();upBell();render();tick();sync();setTimeout(pushSub,4000);setInterval(function(){tick();applyTheme()},20000);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
